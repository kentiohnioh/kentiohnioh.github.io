<!-- Accessibility Skip Link -->
<a
  href="#main-content"
  class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 z-50 px-4 py-2 bg-emerald-500 text-neutral-950 font-mono text-xs font-bold rounded shadow-lg"
>
  Skip to content
</a>

<!-- Personal Masthead -->
<header class="border-b border-neutral-900/80 sticky top-0 z-40 bg-neutral-950/70 backdrop-blur-md">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
    <a
      routerLink="/"
      class="group flex items-baseline gap-2 focus:outline-none focus:ring-1 focus:ring-emerald-400 rounded px-1"
    >
      <span class="font-serif text-xl sm:text-2xl text-neutral-100 tracking-tight group-hover:text-emerald-400 transition-colors">
        {{ authorName }}
      </span>
      <span class="text-[10px] font-mono tracking-widest text-neutral-500 uppercase hidden sm:inline">
        Photography
      </span>
    </a>

    <!-- Top Navigation -->
    <nav class="flex items-center gap-1 sm:gap-4 text-xs font-mono tracking-wider" aria-label="Main Navigation">
      <a
        routerLink="/"
        routerLinkActive="text-emerald-400 font-semibold"
        [routerLinkActiveOptions]="{ exact: true }"
        class="px-3 py-2 text-neutral-400 hover:text-neutral-100 transition-colors rounded"
      >
        Photographs
      </a>
      <a
        routerLink="/about"
        routerLinkActive="text-emerald-400 font-semibold"
        class="px-3 py-2 text-neutral-400 hover:text-neutral-100 transition-colors rounded"
      >
        About
      </a>
    </nav>
  </div>
</header>

<!-- Main Outlet -->
<main id="main-content" class="min-h-[calc(100vh-10rem)]">
  <router-outlet></router-outlet>
</main>

<!-- Footer -->
<footer class="border-t border-neutral-900/80 py-8 mt-16 text-center text-xs font-mono text-neutral-500">
  <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-4">
    <p>{{ copyrightNotice }}</p>
    <div class="flex items-center gap-4">
      <a routerLink="/about" class="hover:text-neutral-300 transition-colors">Licensing Enquiry</a>
      <span class="text-neutral-700">&bull;</span>
      <a routerLink="/" class="hover:text-neutral-300 transition-colors">Archive</a>
    </div>
  </div>
</footer>

<!-- Protected Artwork Glass Toast Notification -->
@if (toastMessage(); as msg) {
  <div
    role="status"
    aria-live="polite"
    class="fixed bottom-6 right-6 z-50 glass-panel px-4 py-3 rounded-lg text-xs font-mono text-neutral-200 border-l-2 border-emerald-400 shadow-2xl transition-all duration-300 animate-in fade-in slide-in-from-bottom-2"
  >
    {{ msg }}
  </div>
}
