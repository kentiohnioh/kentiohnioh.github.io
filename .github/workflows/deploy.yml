name: Deploy Production Site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Verify Catalog Schema
        run: npm run validate:catalog

      - name: Scan Codebase For Secrets & Tokens
        run: npm run scan:secrets

      - name: Run Unit Tests
        run: npm test

      - name: Build Production Site (Public Configuration)
        run: npm run build

      - name: Verify Bundle Tree-Shaking (No Admin / Encoders / MediaPipe)
        run: npm run verify:bundle

      - name: Generate SPA 404 Fallback for Deep Links
        run: |
          cp dist/theng-nioh/browser/index.html dist/theng-nioh/browser/404.html
          touch dist/theng-nioh/browser/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/theng-nioh/browser'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

